name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Check formatting
        run: npm run format:check

      # The album-into-card layout rule behind the by-post photo view. Pure
      # arithmetic and no network, and it guards SITE code rather than the
      # sync's — a layout that leaves a hole shows up in one card out of two
      # hundred, which a build cannot notice and an eye rarely does.
      - name: Verify the album-into-card layout
        run: npm run test:collage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Personal_WebSite
          # Must match deploy.yml: lib/media.ts throws when a photo needs a URL
          # and this is unset, so a PR that would ship broken images fails here
          # rather than on the live site.
          NEXT_PUBLIC_CLOUDINARY_CLOUD: ${{ vars.CLOUDINARY_CLOUD }}
