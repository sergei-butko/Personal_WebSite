name: Sync Telegram photos

on:
  schedule:
    # Every 6 hours, offset from the Threads sync so the two never contend
    # for a push to main.
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-photos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheap, no network, and catches a Telegram markup change as a clear
      # failure rather than a sync that silently returns nothing.
      - name: Verify the parser against the fixture
        run: npm run test:telegram

      - name: Sync photos
        run: npm run sync:photos

      - name: Commit if the channel changed
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/photos.generated.ts public/images/photos
          git commit -m "chore: sync Telegram photos [skip ci]"
          git push
          echo "Pushed — deploy.yml will pick this up."
