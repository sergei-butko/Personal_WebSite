name: Sync Telegram photos

# Manual only, on purpose.
#
# This ran every six hours. That is four Actions runs a day against a channel
# that gets a handful of posts a month, and every run that found something
# pushed a commit to main and triggered a deploy. The channel is not a feed
# anyone is waiting on, so the cost — a noisy main history and a queue of
# pipeline runs — bought nothing.
#
# Nothing about the sync requires a schedule. It is idempotent: public ids come
# from the Telegram message id, so a repeat run replaces the asset in Cloudinary
# rather than adding a copy, and a run that finds no change commits nothing.
# (An earlier scheme hashed the signed source URL, which rotates per fetch;
# thirteen runs left 10,377 files and 827 MB in the repository. That is fixed,
# and is not why this is manual.)
#
# To pull new photos: Actions → Sync Telegram photos → Run workflow, both
# inputs unticked. See docs/RUNBOOK-CLOUDINARY.md for force and prune.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-download and re-hash every photo, ignoring both caches'
        type: boolean
        default: false
      prune:
        description: 'DELETE Cloudinary assets the new snapshot does not reference'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-photos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheap, no network, and catches a Telegram markup change as a clear
      # failure rather than a sync that silently returns nothing.
      - name: Verify the parser against the fixture
        run: npm run test:telegram

      # The rule that decides whether an image is stored again. Pure, fast,
      # and the thing most worth being sure about before a run that writes to
      # Cloudinary.
      - name: Verify the dedup rule
        run: npm run test:dedup

      - name: Sync photos
        run: npm run sync:photos
        env:
          # cloudinary://<api_key>:<api_secret>@<cloud_name>
          # The secret never reaches the site build; delivery only needs the
          # public cloud name, which deploy.yml sets separately.
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          # Both default to off, so an ordinary run is never destructive and
          # never re-downloads the whole channel.
          SYNC_FORCE: ${{ inputs.force && '1' || '0' }}
          SYNC_PRUNE: ${{ inputs.prune && '1' || '0' }}

      - name: Commit if the channel changed
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the generated data. Image bytes are in Cloudinary and
          # /public/images/ is gitignored.
          git add src/content/photos.generated.ts src/content/photo-hashes.generated.ts
          # No [skip ci]: this push is exactly what should trigger
          # deploy.yml, and it is the whole point of running the sync by hand.
          # ci.yml ignores main and this workflow is dispatch-only, so there is
          # no loop to guard against.
          git commit -m "chore: sync Telegram photos"
          git push
          echo "Pushed — deploy.yml will pick this up."
