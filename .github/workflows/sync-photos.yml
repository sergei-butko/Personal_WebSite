name: Sync Telegram photos

# Manual only, on purpose.
#
# This ran every six hours. That is four Actions runs a day against a channel
# that gets a handful of posts a month, and every run that found something
# pushed a commit to main and triggered a deploy. The channel is not a feed
# anyone is waiting on, so the cost — a noisy main history and a queue of
# pipeline runs — bought nothing.
#
# Nothing is committed any more either: the snapshot is a JSON asset in
# Cloudinary, so main gets no "chore: sync" commits at all.
#
# Nothing about the sync requires a schedule. It is idempotent: public ids come
# from the Telegram message id, so a repeat run replaces the asset in Cloudinary
# rather than adding a copy, and a run that finds no change uploads nothing.
# (An earlier scheme hashed the signed source URL, which rotates per fetch;
# thirteen runs left 10,377 files and 827 MB in the repository. That is fixed,
# and is not why this is manual.)
#
# To pull new photos: Actions → Sync Telegram photos → Run workflow, both
# inputs unticked. See docs/RUNBOOK-CLOUDINARY.md for force and prune.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-download and re-hash every photo, ignoring both caches'
        type: boolean
        default: false
      prune:
        description: 'DELETE Cloudinary assets the new snapshot does not reference'
        type: boolean
        default: false
      deploy:
        description: 'Rebuild and publish the site when the sync finishes'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: sync-photos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheap, no network, and catches a Telegram markup change as a clear
      # failure rather than a sync that silently returns nothing.
      - name: Verify the parser against the fixture
        run: npm run test:telegram

      # The rule that decides whether an image is stored again. Pure, fast,
      # and the thing most worth being sure about before a run that writes to
      # Cloudinary.
      - name: Verify the dedup rule
        run: npm run test:dedup

      - name: Sync photos
        id: sync
        run: npm run sync:photos
        env:
          # cloudinary://<api_key>:<api_secret>@<cloud_name>
          # The secret never reaches the site build; delivery only needs the
          # public cloud name, which deploy.yml sets separately.
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          # Both default to off, so an ordinary run is never destructive and
          # never re-downloads the whole channel.
          SYNC_FORCE: ${{ inputs.force && '1' || '0' }}
          SYNC_PRUNE: ${{ inputs.prune && '1' || '0' }}
          # Optional, and the sync says which state it is in on every run.
          # Without them each album's song is still recorded from the channel
          # page — title and artist — and the site renders a track card that
          # links to Telegram. With them the file itself is re-hosted and the
          # card becomes a player. Telegram serves audio to nobody who is not
          # logged in, so there is no scrape that replaces these.
          # See docs/RUNBOOK-CLOUDINARY.md for how to create them.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_AUDIO_CHAT: ${{ secrets.TELEGRAM_AUDIO_CHAT }}

      # After the sync, before the deploy: a run that wrote to Cloudinary is
      # the moment the store can have gained a row pointing at nothing, and the
      # deploy below is gated on success(), so a hole here stops the publish
      # rather than shipping HTML that describes it.
      #
      # Unconditional, not gated on `changed`. The failure this catches most
      # often is not a sync at all — it is a picture added by hand through the
      # Media Library, which names an asset with a UUID unless you set the
      # public id yourself, and which happens between runs. A sync that changed
      # nothing is still the first chance CI gets to notice one.
      #
      # Not in ci.yml: the store is not part of a pull request's diff, and
      # CLOUDINARY_URL is a secret that Dependabot and fork PRs cannot read —
      # so the step would either be skipped exactly where it is needed or turn
      # every Dependabot PR red, and a red verify on one of those is the whole
      # safeguard this repo has against a bad upgrade.
      - name: Verify the media store
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: npm run media:verify

      - name: Deploy the site
        # No commit is pushed, so nothing triggers deploy.yml on its own and
        # the sync has to dispatch it.
        #
        # Always --ref the DEFAULT branch, never the branch this run happened
        # to start from. deploy.yml publishes to production Pages, so
        # dispatching it against a feature branch would put that branch on the
        # live site — which the old design could not do, because deploy.yml
        # only ever ran on push to main. The runbook tells you to sync from a
        # branch before merging; that must not publish anything.
        if: >-
          success()
          && inputs.deploy
          && steps.sync.outputs.changed == 'true'
          && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run deploy.yml --ref "$DEFAULT_BRANCH"
          echo "Deploy dispatched against $DEFAULT_BRANCH."

      - name: Explain why no deploy was dispatched
        if: >-
          success()
          && !(inputs.deploy
          && steps.sync.outputs.changed == 'true'
          && github.ref_name == github.event.repository.default_branch)
        run: |
          if [[ "${{ inputs.deploy }}" != "true" ]]; then
            echo "The deploy input was unticked. Cloudinary is updated; the site is not."
          elif [[ "${{ steps.sync.outputs.changed }}" != "true" ]]; then
            echo "Nothing changed, so there is nothing to publish."
          else
            echo "Ran on '${{ github.ref_name }}', not the default branch."
            echo "Cloudinary is updated. Merge, then run Deploy to publish."
          fi
