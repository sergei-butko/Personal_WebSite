name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish Pages, nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; do not cancel one already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Project page: the site lives under /<repo-name>/.
          # Set to '' when a custom domain is added.
          NEXT_PUBLIC_BASE_PATH: /Personal_WebSite
          # Public by design — it appears in every image URL the site serves.
          # A repository VARIABLE, not a secret. The API key and secret live in
          # secrets.CLOUDINARY_URL and are only ever used by the sync workflows.
          NEXT_PUBLIC_CLOUDINARY_CLOUD: ${{ vars.CLOUDINARY_CLOUD }}
          # The /admin write API — workers/admin-api. A repository VARIABLE,
          # not a secret: it is only a URL, and the Worker authorises every
          # request itself. Unset simply means /admin renders "not configured".
          NEXT_PUBLIC_ADMIN_API: ${{ vars.ADMIN_API }}

      # Once NETLIFY_URL is set, GitHub Pages stops being the site and becomes
      # a redirect to it, so links people already have keep working. Until it
      # is set, this is a no-op and Pages still serves the full site.
      - name: Replace with a redirect stub if the site has moved
        if: vars.NETLIFY_URL != ''
        env:
          SITE_URL: ${{ vars.NETLIFY_URL }}
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          sed "s|SITE_URL|${SITE_URL}|g" .github/pages-stub/index.html > out/index.html
          # Same page for every path: a project page cannot rewrite, so a deep
          # link like /en/photos/ has to land somewhere rather than 404.
          cp out/index.html out/404.html
          echo "Pages will publish a redirect to ${SITE_URL}."

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
