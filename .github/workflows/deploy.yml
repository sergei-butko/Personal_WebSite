name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish Pages, nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; do not cancel one already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Project page: the site lives under /<repo-name>/.
          # Set to '' when a custom domain is added.
          NEXT_PUBLIC_BASE_PATH: /Personal_WebSite
          # Public by design — it appears in every image URL the site serves.
          # A repository VARIABLE, not a secret. The API key and secret live in
          # secrets.CLOUDINARY_URL and are only ever used by the sync workflows.
          NEXT_PUBLIC_CLOUDINARY_CLOUD: ${{ vars.CLOUDINARY_CLOUD }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
