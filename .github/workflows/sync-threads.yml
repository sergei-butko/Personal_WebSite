name: Sync Threads

# Daily, plus on demand.
#
# It once ran every six hours and pushed a "chore: sync Threads posts" commit
# to main whenever the feed moved — four pipeline runs a day and a main history
# made of bot commits. It was made manual to stop that, and then the reason
# went away: nothing is committed any more, because the snapshot is a JSON
# asset in Cloudinary (data/threads.json) that the site build fetches. So the
# schedule is back, once a day rather than four times, and main still gets no
# generated content and no sync commits at all.
#
# 10:30 UTC is 13:30 in Kyiv while Ukraine is on EEST. Cron here is UTC and has
# no timezone support, so the run lands an hour earlier in local terms once the
# clocks go back — expressing "13:30 Kyiv" is not possible, and an hour of
# drift on a feed nobody is waiting on is the cheaper of the two answers.
# :30 rather than :00 on purpose: scheduled runs are best-effort and GitHub
# queues them heavily at the top of the hour.
#
# Re-running is safe. Public ids come from Meta's post id, so a repeat run
# replaces assets in Cloudinary rather than adding copies, and a run that finds
# no change uploads nothing.
#
# To pull new posts by hand: Actions -> Sync Threads -> Run workflow.
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Rebuild and publish the site when the sync finishes'
        type: boolean
        default: true

# No commit to push; the job only needs to dispatch the deploy.
permissions:
  contents: read
  actions: write

concurrency:
  group: sync-threads
  cancel-in-progress: false

# Whether this run should publish afterwards.
#
# `inputs` exists ONLY for workflow_dispatch. On a scheduled run `inputs.deploy`
# is null, so gating the deploy on it directly would have every nightly sync
# write to Cloudinary and never rebuild the site. That failure hides itself:
# lib/live-snapshot.ts re-reads the snapshot in the browser, so the page would
# still show new posts while the prerendered HTML — the copy search engines and
# anyone without JavaScript get — quietly went stale.
#
# Computed once here rather than repeated in the two `if`s below, which is
# where the two of them would drift apart.
env:
  WANTS_DEPLOY: ${{ github.event_name == 'schedule' || inputs.deploy }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync posts from Threads
        id: sync
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # Images and the snapshot are both re-hosted in Cloudinary, never
          # committed. The secret never reaches the site build; delivery only
          # needs the public cloud name, which deploy.yml sets separately.
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: npm run sync:threads

      # After the sync, before the deploy: a run that wrote to Cloudinary is
      # the moment the store can have gained a row pointing at nothing, and the
      # deploy below is gated on success(), so a hole here stops the publish
      # rather than shipping HTML that describes it.
      #
      # Unconditional, not gated on `changed`. The failure this catches most
      # often is not a sync at all — it is a picture added by hand through the
      # Media Library, which names an asset with a UUID unless you set the
      # public id yourself, and which happens between runs. A sync that changed
      # nothing is still the first chance CI gets to notice one.
      #
      # Not in ci.yml: the store is not part of a pull request's diff, and
      # CLOUDINARY_URL is a secret that Dependabot and fork PRs cannot read —
      # so the step would either be skipped exactly where it is needed or turn
      # every Dependabot PR red, and a red verify on one of those is the whole
      # safeguard this repo has against a bad upgrade.
      - name: Verify the media store
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: npm run media:verify

      - name: Deploy the site
        # No commit is pushed, so nothing triggers deploy.yml on its own and
        # the sync has to dispatch it.
        #
        # Always --ref the DEFAULT branch, never the branch this run happened
        # to start from. deploy.yml publishes to production Pages, so
        # dispatching it against a feature branch would put that branch on the
        # live site — which the old design could not do, because deploy.yml
        # only ever ran on push to main. The runbook tells you to sync from a
        # branch before merging; that must not publish anything.
        if: >-
          success()
          && env.WANTS_DEPLOY == 'true'
          && steps.sync.outputs.changed == 'true'
          && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run deploy.yml --ref "$DEFAULT_BRANCH"
          echo "Deploy dispatched against $DEFAULT_BRANCH."

      - name: Explain why no deploy was dispatched
        if: >-
          success()
          && !(env.WANTS_DEPLOY == 'true'
          && steps.sync.outputs.changed == 'true'
          && github.ref_name == github.event.repository.default_branch)
        run: |
          if [[ "$WANTS_DEPLOY" != "true" ]]; then
            echo "The deploy input was unticked. Cloudinary is updated; the site is not."
          elif [[ "${{ steps.sync.outputs.changed }}" != "true" ]]; then
            echo "Nothing changed, so there is nothing to publish."
          else
            echo "Ran on '${{ github.ref_name }}', not the default branch."
            echo "Cloudinary is updated. Merge, then run Deploy to publish."
          fi
